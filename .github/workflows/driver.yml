name: Final Build Audio Driver Lenovo IdeaPad 3 11IGL05

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile_driver:
    name: Build Windows 10 x64 Driver Bundle
    runs-on: windows-2022

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v4

    - name: 2. Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 3. Unduh dan Pasang Windows Driver Kit (WDK) Ekstensi Visual Studio
      run: |
        # 1. Mengunduh eksekutor instalasi WDK resmi untuk Windows 10/11
        Invoke-WebRequest -Uri "https://microsoft.com" -OutFile "wdksetup.exe"
        
        # 2. Menjalankan instalasi secara senyap (silent) guna menyuntikkan komponen 'WindowsKernelModeDriver143'
        Start-Process -FilePath "wdksetup.exe" -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDriverKitFeature" -Wait
        
        # 3. Membersihkan berkas instalasi mentah setelah sukses terpasang
        Remove-Item "wdksetup.exe" -Force

    - name: 4. Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
        if ($sln) {
            nuget restore $sln.FullName
        }

    - name: 5. Build Driver Package (Release x64 - Modern WDK)
      run: |
        $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
        if ($sln) {
            # Memaksa MSBuild menggunakan PlatformToolset v143 yang baru saja disuntikkan pada langkah ke-3
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:LatestTargetPlatformVersion=true /p:PlatformToolset=WindowsKernelModeDriver143 /t:Build
        } else {
            Write-Error "Gagal melakukan build karena berkas solusi (.sln) tidak ditemukan!"
            exit 1
        }

    - name: 6. Archive and Upload Driver Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Lenovo-IdeaPad3-11IGL05-Audio-Windows10
        path: |
          **/x64/Release/**/*.sys
          **/x64/Release/**/*.inf
          **/x64/Release/**/*.cat
        if-no-files-found: error
