name: SSH Runner Access (Tailscale Direct Bash)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Connect Tailscale via Bash
        run: |
          # 1. Install Tailscale CLI secara langsung
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # 2. Login menggunakan OAuth Client ID dan Secret langsung
          sudo tailscale up --authkey="tskey-client-kUvXJzrd8x11CNTRL-oNDPjAhYDDjnJdCSLtrxCjBqF9dU3S2iA" --hostname="github-runner"

      - name: Setup Password & Hold SSH Session
        run: |
          echo "runner:123456" | sudo chpasswd

          echo "================================================="
          echo "   TAILSCALE SSH RUNNER CONNECTED SUCCESSFULLY   "
          echo "================================================="
          echo " Hostname     : $(hostname)"
          echo " Tailscale IP : $(tailscale ip -4)"
          echo " Username     : runner"
          echo " Password     : 123456"
          echo "================================================="
          echo " ssh runner@$(tailscale ip -4)"
          echo "================================================="
          
          sleep 3600
