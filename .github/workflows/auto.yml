name: SSH Runner Access

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
          # Menjaga agar sesi tidak runtuh jika terjadi lonjakan jaringan
          connect-timeout: 30
