name: SSH Runner Access (Tailscale OAuth)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Setup Password & Hold SSH Session
        run: |
          # Set password user 'runner' menjadi '123456'
          echo "runner:123456" | sudo chpasswd

          echo "================================================="
          echo "   TAILSCALE SSH RUNNER CONNECTED SUCCESSFULLY   "
          echo "================================================="
          echo " Hostname     : $(hostname)"
          echo " Tailscale IP : $(tailscale ip -4)"
          echo " Username     : runner"
          echo " Password     : 123456"
          echo "================================================="
          echo " Jalankan perintah berikut di terminal lokal Anda:"
          echo " ssh runner@$(tailscale ip -4)"
          echo "================================================="
          echo " Menahan runner selama 1 jam..."
          
          sleep 3600
