name: Antigravity Automated Repository Creator

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Nama Repositori Baru (contoh: ldi-system-core)'
        required: true
        type: string
      repo_visibility:
        description: 'Visibilitas Repositori'
        required: true
        type: choice
        default: 'public'
        options:
          - public
          - private
      repo_description:
        description: 'Deskripsi Repositori'
        required: false
        type: string
        default: 'Automated repository generated by Antigravity Workflow'

jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Utama
        uses: actions/checkout@v4

      - name: Setup Kredensial SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Autentikasi GitHub CLI
        run: echo "${{ secrets.PAT_GITHUB }}" | gh auth login --with-token

      - name: Konfigurasi Identitas Git
        run: |
          git config --global user.name "muhammadfikri-dev"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Buat Repositori Baru via gh CLI
        env:
          REPO_NAME: ${{ inputs.repo_name }}
          VISIBILITY: ${{ inputs.repo_visibility }}
          DESCRIPTION: ${{ inputs.repo_description }}
        run: |
          echo "Memproses pembuatan repositori: $REPO_NAME ($VISIBILITY)..."
          
          # 1. Eksekusi pembuatan repositori baru di akun GitHub Anda
          gh repo create "muhammadfikri-dev/$REPO_NAME" \
            --$VISIBILITY \
            --description "$DESCRIPTION" \
            --confirm

          echo "✓ Repositori https://github.com/muhammadfikri-dev/$REPO_NAME berhasil dibuat!"

      - name: Inisialisasi Konten Awal & Push
        env:
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          # 2. Kloning repositori baru yang baru saja dibuat ke dalam runner
          git clone "https://x-access-token:${{ secrets.PAT_GITHUB }}@github.com/muhammadfikri-dev/$REPO_NAME.git"
          cd "$REPO_NAME"

          # 3. Buat file README.md awal
          echo "# $REPO_NAME" > README.md
          echo "" >> README.md
          echo "${{ inputs.repo_description }}" >> README.md
          echo "" >> README.md
          echo "*Generated automatically via Antigravity Automation Framework.*" >> README.md

          # 4. Commit dan push ke branch main
          git checkout -b main
          git add README.md
          git commit -m "feat: initial commit via Antigravity automation"
          git push origin main

          echo "✓ Inisialisasi README.md dan push awal selesai!"
