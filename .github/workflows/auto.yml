name: SSH Runner Access (Tailscale Direct)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: "tskey-auth-kBp3E1KADX11CNTRL-wptjkPnnuC6JkF1uiztcC6MMF6iiSqav"

      - name: Setup Password & Hold SSH Session
        run: |
          # 1. Set password untuk user 'runner' menjadi '123456'
          echo "runner:123456" | sudo chpasswd

          # 2. Tampilkan Informasi Koneksi di Log Konsol
          echo "================================================="
          echo "   TAILSCALE SSH RUNNER CONNECTED SUCCESSFULLY   "
          echo "================================================="
          echo " Hostname     : $(hostname)"
          echo " Tailscale IP : $(tailscale ip -4)"
          echo " Username     : runner"
          echo " Password     : 123456"
          echo "================================================="
          echo " Jalankan perintah berikut di terminal lokal Anda:"
          echo " ssh runner@$(tailscale ip -4)"
          echo "================================================="
          echo " Sesi SSH aktif. Menahan runner selama 1 jam..."
          
          # 3. Tahan eksekusi workflow selama 3600 detik (1 jam)
          sleep 3600
