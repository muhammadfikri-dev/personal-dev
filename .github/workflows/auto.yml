name: SSH Runner Access (Tailscale Direct)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Connect Tailscale
        run: |
          # 1. Install Tailscale CLI secara otomatis
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # 2. Login menggunakan Auth Key Anda
          sudo tailscale up \
            --authkey="tskey-auth-kU3vFdTXM421CNTRL-w3CtxrbTThMG8ErvrXrDhMpAEZdG3WeC" \
            --hostname="github-runner"

      - name: Setup Password & Hold SSH Session
        run: |
          # Set password user 'runner' menjadi '123456'
          echo "runner:123456" | sudo chpasswd

          echo "================================================="
          echo "   TAILSCALE SSH RUNNER CONNECTED SUCCESSFULLY   "
          echo "================================================="
          echo " Hostname     : $(hostname)"
          echo " Tailscale IP : $(tailscale ip -4)"
          echo " Username     : runner"
          echo " Password     : 123456"
          echo "================================================="
          echo " Silakan SSH dari terminal lokal Anda:"
          echo " ssh runner@$(tailscale ip -4)"
          echo "================================================="
          
          # Menahan runner tetap berjalan selama 1 jam
          sleep 3600
